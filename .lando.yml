name: vga-nextgen
recipe: laravel
config:
  webroot: public
  php: 8.5
  xdebug: 'develop,debug'

services:
  appserver:
    overrides:
      environment:
        PHP_IDE_CONFIG: "serverName=lando"
        XDEBUG_SESSION_START: lando

  phpmyadmin:
    type: phpmyadmin

  adminer:
    type: compose
    services:
      image: dehy/adminer
      command: /bin/s6-svscan /etc/services.d
    portforward: true

proxy:
  appserver:
    - vga-nextgen.lndo.site
    - "*.vga-nextgen.lndo.site"
  phpmyadmin:
    - pma.vga-nextgen.lndo.site
  adminer:
    - adminer.vga-nextgen.lndo.site
